name: Scoreo2 build & package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++-13 libboost-dev

    - name: build
      run: ./bootstrap.sh -c -d -t
